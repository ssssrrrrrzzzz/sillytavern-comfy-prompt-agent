name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: python3 -m compileall -q server-plugin/bundled/anima-prompt/scripts
      - run: python3 server-plugin/bundled/anima-prompt/scripts/check_format.py "2girls, black hair, blonde hair, classroom" --json
